<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能五子棋网页版 - Gomoku Web Pro</title>
    <style>
        body {
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: "Microsoft YaHei", sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        .control-panel {
            background-color: #34495e;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        button, select {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-pve { background-color: #3498db; color: white; }
        .btn-pvp { background-color: #eba568; color: white; }
        .btn-undo { background-color: #95a5a6; color: white; }
        .btn-hint { background-color: #f4de6d; color: #0c1a3f; }
        .btn-reset { background-color: #e74c3c; color: white; }
        button:hover { opacity: 0.85; }
        #status {
            font-size: 16px;
            margin: 10px 0;
            color: #f0b05b;
            font-weight: bold;
        }
        canvas {
            background-color: #DCB35C;
            border-radius: 4px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>智能五子棋 Web Pro</h2>

    <div class="control-panel">
        <div>
            <button class="btn-pve" onclick="setMode('pve')">人机对战</button>
            <button class="btn-pvp" onclick="setMode('pvp')">双人对战</button>
        </div>
        <div>
            <label for="difficulty">AI难度: </label>
            <select id="difficulty" onchange="changeDifficulty()">
                <option value="easy">简单 (Easy)</option>
                <option value="medium" selected>中等 (Medium)</option>
                <option value="hard">困难 (Hard)</option>
            </select>
        </div>
        <div>
            <button class="btn-undo" onclick="undoMove()">悔棋</button>
            <button class="btn-hint" onclick="getHint()">提示</button>
            <button class="btn-reset" onclick="resetGame()">重开</button>
        </div>
    </div>

    <div id="status">模式：人机对战 | 请黑棋（玩家）落子</div>
    <canvas id="boardCanvas" width="640" height="640"></canvas>
</div>

<script>
    const canvas = document.getElementById('boardCanvas');
    const ctx = canvas.getContext('2d');
    const boardSize = 15;
    const gridSize = 40;
    const margin = 40;

    let board = Array(boardSize).fill(0).map(() => Array(boardSize).fill(0));
    let gameMode = 'pve';
    let currentPlayer = 1; // 1: 黑棋, 2: 白棋
    let gameOver = false;
    let lastMove = null;
    let hintMove = null;

    function drawBoard() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 网格线
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 1;
        for (let i = 0; i < boardSize; i++) {
            let start = margin;
            let end = margin + gridSize * (boardSize - 1);
            ctx.beginPath();
            ctx.moveTo(start, margin + i * gridSize);
            ctx.lineTo(end, margin + i * gridSize);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(margin + i * gridSize, start);
            ctx.lineTo(margin + i * gridSize, end);
            ctx.stroke();
        }

        // 星位
        const stars = [3, 7, 11];
        for (let x of stars) {
            for (let y of stars) {
                ctx.beginPath();
                ctx.arc(margin + x * gridSize, margin + y * gridSize, 4, 0, 2 * Math.PI);
                ctx.fillStyle = "black";
                ctx.fill();
            }
        }

        // 画棋子
        for (let y = 0; y < boardSize; y++) {
            for (let x = 0; x < boardSize; x++) {
                if (board[y][x] !== 0) {
                    let px = margin + x * gridSize;
                    let py = margin + y * gridSize;
                    ctx.beginPath();
                    ctx.arc(px, py, gridSize / 2 - 3, 0, 2 * Math.PI);
                    ctx.fillStyle = board[y][x] === 1 ? 'black' : 'white';
                    ctx.fill();
                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = 'black';
                    ctx.stroke();
                }
            }
        }

        // 高亮最后一子
        if (lastMove) {
            let lx = margin + lastMove[0] * gridSize;
            let ly = margin + lastMove[1] * gridSize;
            ctx.beginPath();
            ctx.arc(lx, ly, 5, 0, 2 * Math.PI);
            ctx.fillStyle = 'red';
            ctx.fill();
        }

        // 高亮提示位置
        if (hintMove) {
            let hx = margin + hintMove[0] * gridSize;
            let hy = margin + hintMove[1] * gridSize;
            ctx.beginPath();
            ctx.arc(hx, hy, 12, 0, 2 * Math.PI);
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 3;
            ctx.stroke();
        }
    }

    canvas.addEventListener('click', async function(event) {
        if (gameOver) return;
        if (gameMode === 'pve' && currentPlayer === 2) return;

        const rect = canvas.getBoundingClientRect();
        const x = Math.round((event.clientX - rect.left - margin) / gridSize);
        const y = Math.round((event.clientY - rect.top - margin) / gridSize);

        if (x >= 0 && x < boardSize && y >= 0 && y < boardSize && board[y][x] === 0) {
            hintMove = null;
            let response = await fetch('/move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ x, y, mode: gameMode, current_player: currentPlayer })
            });
            let data = await response.json();
            if (data.success) {
                board = data.board;
                lastMove = data.last_move;
                
                if (data.winner !== 0) {
                    gameOver = true;
                    drawBoard();
                    let winnerStr = data.winner === 1 ? '黑棋' : '白棋';
                    document.getElementById('status').innerText = `游戏结束！${winnerStr} 获胜！`;
                    alert(`恭喜 ${winnerStr} 获胜！`);
                    return;
                }

                if (gameMode === 'pvp') {
                    currentPlayer = currentPlayer === 1 ? 2 : 1;
                }
                updateStatus();
                drawBoard();
            }
        }
    });

    async function undoMove() {
        if (gameOver) return;
        let response = await fetch('/undo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mode: gameMode })
        });
        let data = await response.json();
        if (data.success) {
            board = data.board;
            lastMove = data.last_move;
            hintMove = null;
            if (gameMode === 'pvp' && lastMove) {
                // 回退玩家
                currentPlayer = board[lastMove[1]][lastMove[0]] === 1 ? 2 : 1;
            } else {
                currentPlayer = 1;
            }
            updateStatus();
            drawBoard();
        }
    }

    async function getHint() {
        if (gameOver) return;
        let response = await fetch('/hint', { method: 'POST' });
        let data = await response.json();
        if (data.success) {
            hintMove = data.hint;
            drawBoard();
            setTimeout(() => { hintMove = null; drawBoard(); }, 1500);
        }
    }

    async function resetGame() {
        let diff = document.getElementById('difficulty').value;
        let response = await fetch('/reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ difficulty: diff })
        });
        let data = await response.json();
        board = data.board;
        gameOver = false;
        currentPlayer = 1;
        lastMove = null;
        hintMove = null;
        updateStatus();
        drawBoard();
    }

    function setMode(mode) {
        gameMode = mode;
        resetGame();
    }

    function changeDifficulty() {
        if (gameMode === 'pve') resetGame();
    }

    function updateStatus() {
        let modeStr = gameMode === 'pve' ? '人机对战' : '双人对战';
        let playerStr = currentPlayer === 1 ? '黑棋（玩家1）' : (gameMode === 'pve' ? 'AI 思考中...' : '白棋（玩家2）');
        document.getElementById('status').innerText = `模式：${modeStr} | 轮到：${playerStr}`;
    }

    drawBoard();
</script>
</body>
</html>
